name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser test
        run: npm run test:browser

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Verify package
        run: npm run check:zip

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-fast-pipe-${{ github.sha }}
          path: gitlab-fast-pipe.zip
          if-no-files-found: error
          retention-days: 14
